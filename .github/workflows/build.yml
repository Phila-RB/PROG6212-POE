name: .NET API Build & Test 🚀

# 1. Define when this workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Define the tasks (jobs) to execute
jobs:
  build-and-test:
    name: Build and Test Project
    runs-on: ubuntu-latest  # Runs on a clean Microsoft-hosted Linux runner

    steps:
    # Step 1: Download the repository code onto the runner
    - name: Checkout Code 📂
      uses: actions/checkout@v4

    # Step 2: Install the requested .NET SDK version
    - name: Setup .NET SDK 📦
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Use '9.0.x' if targeting .NET 9

    # Step 3: Fetch all required NuGet dependencies
    - name: Restore Dependencies 📥
      run: dotnet restore

    # Step 4: Compile the application in Release mode without re-restoring
    - name: Build Application 🧱
      run: dotnet build --configuration Release --no-restore

    # Step 5: Execute all unit and integration tests
    - name: Run Tests 🧪
      run: dotnet test --configuration Release --no-build --verbosity normal
